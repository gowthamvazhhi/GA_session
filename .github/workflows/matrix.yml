name: Node Matrix

on:
  push:
   branches: 
     - main
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [18, 20, 22]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
